name: Checks

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ui-tests.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ui-test-key
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-audit
          path: test-results/
